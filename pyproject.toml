[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clickhouse-alchemy"
version = "0.1.0"
description = "A SQLAlchemy Core-style library for building ClickHouse SQL statements"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Aidan Lewis", email = "aidan@axiomalaska.com" }
]
keywords = [
    "clickhouse",
    "sql",
    "database",
    "query-builder",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "clickhouse-connect>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aidan-axiom/clickhouse-alchemy"
Documentation = "https://github.com/aidan-axiom/clickhouse-alchemy#readme"
Repository = "https://github.com/aidan-axiom/clickhouse-alchemy"
Issues = "https://github.com/aidan-axiom/clickhouse-alchemy/issues"

[tool.hatch.build.targets.wheel]
packages = ["clickhouse_alchemy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
